<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이름 입력</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 50px;
    }

    .container {
        width: 500px;
    }

    label {
        display: inline-block;
        width: 50px;
        font-size: 20px;
    }

    input {
        width: 180px;
        height: 30px;
        font-size: 18px;
    }

    button {
        width: 80px;
        height: 36px;
        font-size: 16px;
        margin-left: 10px;
    }

    p {
        margin-top: 40px;
        font-size: 24px;
    }
</style>
</head>

<body>

<div class="container">

    <label>이름</label>

    <input type="text" id="name">

    <button onclick="showName()">입력</button>

    <p>
        당신의 이름은
        <span id="result">_____</span>
        입니다.
    </p>

</div>

<script>

function showName() {

    const name = document.getElementById("name").value;

    document.getElementById("result").innerText = name;

}

</script>

</body>
</html>
